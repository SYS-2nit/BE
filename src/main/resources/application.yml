spring:
  application:
    name: DBMonitor

  # DataBase
  datasource:
    driver-class-name: oracle.jdbc.driver.OracleDriver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource

  # Redis 설정 (V2, V3용)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  security:
    require-ssl: true
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://www.ccdb.site
      - https://www.ccdb.site:8080  # 포트 8080 추가
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# 스웨거 설정
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    display-request-duration: true
  paths-to-match:
    - /api/**
  packages-to-scan:
    - com.sys.dbmonitor

# 로깅 설정
logging:
  level:
    org.springframework.security: DEBUG
    com.sys.dbmonitor: DEBUG

server:
  port: 8080
  servlet:
    context-path: /api
  ssl:
    enabled: false
    key-store: /app/ssl/keystore.p12  # Docker 컨테이너 내부 경로로 변경
    key-store-type: PKCS12
    key-store-password: ${SSL_PASSWORD}  # 기본값 추가
    key-alias: tomcat

mybatis:
  mapper-locations: classpath:/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.sys.dbmonitor.domains.*.domain

jmeter:
  home: /opt/homebrew/opt/jmeter/libexec
  test:
    plan: src/test/jmeter/coupon_load_test.jmx