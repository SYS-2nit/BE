spring:
  application:
    name: DBMonitor

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: create
    database-platform: org.hibernate.dialect.OracleDialect


  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  security:
    require-ssl: true
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://www.ccdb.site
      - https://www.ccdb.site:8080  # 포트 8080 추가
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers: "*"
    allow-credentials: true



# 스웨거 설정
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    display-request-duration: true
  paths-to-match:
    - /api/**
  packages-to-scan:
    - com.sys.dbmonitor

# 로깅 설정
logging:
  level:
    org.springframework.security: DEBUG
    com.sys.dbmonitor: DEBUG

server:
  port: 8080
  servlet:
    context-path:
  ssl:
    enabled: true
    key-store: /app/ssl/keystore.p12  # Docker 컨테이너 내부 경로로 변경
    key-store-type: PKCS12
    key-store-password: ${SSL_PASSWORD}  # 기본값 추가
    key-alias: tomcat
  address: 0.0.0.0

jmeter:
  home: /opt/homebrew/opt/jmeter/libexec
  test:
    plan: src/test/jmeter/coupon_load_test.jmx

swingbench:
  jar:
    path: ${user.dir}/swingbench/jar/swingbench.jar
  ojdbc:
    path: ${user.dir}/swingbench/jar/ojdbc8.jar

# 암호화 키 설정
app:
  encryption:
    key: ${ENCRYPTION_KEY:defaultEncryptionKey1234567890123456}  # 최소 16자 (AES-128)
  metric:
    # 운영 환경 기본값: true → metric_data 저장 허용
    persist: true