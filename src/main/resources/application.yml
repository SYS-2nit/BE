spring:
  application:
    name: DBMonitor

  # DataBase
  datasource:
    driver-class-name: oracle.jdbc.driver.OracleDriver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource

  # Redis 설정 (V2, V3용)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  # Kafka 설정 (V3용 - 미사용 시 주석 처리)
#  kafka:
#    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
#    consumer:
#      group-id: coupon-service
#      auto-offset-reset: earliest
#      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
#      properties:
#        spring.json.trusted.packages: "*"
#    producer:
#      key-serializer: org.apache.kafka.common.serialization.StringSerializer
#      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  security:
    require-ssl: true
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://www.ccdb.site
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# 스웨거 설정
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    display-request-duration: true
  paths-to-match:
    - /api/**
  packages-to-scan:
    - com.sys.dbmonitor
    -
# mybatis sql
logging:
  level:
    org.springframework.security: DEBUG
    com.sys.dbmonitor: DEBUG



server:
  port: 8080
  servlet:
    context-path: /api
  ssl:
    key-store: classpath:keystore.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_PASSWORD}




mybatis:
  mapper-locations: classpath:/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.sys.dbmonitor.domains.*.domain



jmeter:
  home: /opt/homebrew/opt/jmeter/libexec
  test:
    plan: src/test/jmeter/coupon_load_test.jmx