spring:
  application:
    name: DBMonitor

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2 # 응답의 창의성을 낮춰 일관된 결과를 유도

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: create
    database-platform: org.hibernate.dialect.OracleDialect

  # 이메일 설정 (개발 환경용 - 테스트용)
  mail:
    host: ${MAIL_HOST:smtp.naver.com}  # 환경 변수 또는 기본값 (네이버: smtp.naver.com)
    port: ${MAIL_PORT:587}             # 환경 변수 또는 기본값 (네이버: 587 또는 465)
    username: ${MAIL_USERNAME:}        # 환경 변수 (필수, 네이버 이메일 주소)
    password: ${MAIL_PASSWORD:}         # 환경 변수 (필수, 네이버 비밀번호)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  # Redis Repository 자동 설정 제외 (JPA Repository와 충돌 방지)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration


  security:
    require-ssl: true
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://www.ccdb.site
      - https://www.ccdb.site:8080  # 포트 8080 추가
      - http://localhost:3000
      - http://localhost:3001
      - http://localhost:5173
      - https://www.ccdb.site/*
      - https://www.ccdb.site/**
      - https://www.ccdb.site/
      - https://www.ccdb.site
      - https://www.ccdb.site:8080/*
      - https://*.cloudfront.net
      - https://d2gb1dq0c4tvp1.cloudfront.net
      - https://*.cloudfront.net/*
      - https://d2gb1dq0c4tvp1.cloudfront.net/*
      - https://*.cloudfront.net/**
      - https://d2gb1dq0c4tvp1.cloudfront.net/**
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers: "*"
    allow-credentials: true



# 스웨거 설정
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    display-request-duration: true
  paths-to-match:
    - /api/**
  packages-to-scan:
    - com.sys.dbmonitor

# 로깅 설정
logging:
  level:
    org.springframework.security: DEBUG
    com.sys.dbmonitor: DEBUG

server:
  port: 8080
  servlet:
    context-path:
  ssl:
    enabled: true
    key-store: /app/ssl/keystore.p12  # Docker 컨테이너 내부 경로로 변경
    key-store-type: PKCS12
    key-store-password: ${SSL_PASSWORD}  # 기본값 추가
    key-alias: tomcat
  address: 0.0.0.0

jmeter:
  home: /opt/homebrew/opt/jmeter/libexec
  test:
    plan: src/test/jmeter/coupon_load_test.jmx

swingbench:
  jar:
    path: ${user.dir}/swingbench/jar/swingbench.jar
  ojdbc:
    path: ${user.dir}/swingbench/jar/ojdbc8.jar

# 암호화 키 설정
app:
  encryption:
    key: ${ENCRYPTION_KEY:defaultEncryptionKey1234567890123456}  # 최소 16자 (AES-128)
  metric:
    # 운영 환경 기본값: true → metric_data 저장 허용
    persist: true
  thread-pool:
    # 배치 작업용 스레드 풀 설정
    batch:
      core-size: 5    # 코어 스레드 수
      max-size: 10    # 최대 스레드 수
    # 진단 작업용 스레드 풀 설정 (Java 기반만)
    diagnosis:
      core-size: 2    # 코어 스레드 수
      max-size: 5     # 최대 스레드 수