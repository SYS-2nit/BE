# 로컬 개발 환경 설정
spring:
  security:
    require-ssl: false  # 로컬 개발에서는 SSL 비활성화


  # DataBase
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver  # 최신 방식
    url: ${WHA_DB_URL}
    username: ${WHA_DB_USERNAME}
    password: ${WHA_DB_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource


  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  
  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379
 
  
# 로그 레벨 조정 (로컬 개발용)
logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.sys.dbmonitor: DEBUG
    org.apache.coyote.http11: WARN  # HTTP 파싱 오류 로그 레벨 조정

# SSL 비활성화 명시
server:
  ssl:
    enabled: false

