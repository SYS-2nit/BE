# 로컬 개발 환경 설정
spring:
  security:
    require-ssl: false  # 로컬 개발에서는 SSL 비활성화

  # DataBase (Oracle - 기본 데이터 저장용)
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${MAIN_DB_URL}
    username: ${MAIN_DB_USERNAME}
    password: ${MAIN_DB_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  
  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

  # 이메일 설정 (개발 환경용 - 테스트용)
  mail:
    host: ${MAIL_HOST:smtp.naver.com}  # 환경 변수 또는 기본값 (네이버: smtp.naver.com)
    port: ${MAIL_PORT:587}             # 환경 변수 또는 기본값 (네이버: 587 또는 465)
    username: ${MAIL_USERNAME:}        # 환경 변수 (필수, 네이버 이메일 주소)
    password: ${MAIL_PASSWORD:}         # 환경 변수 (필수, 네이버 비밀번호)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.sys.dbmonitor: DEBUG
    org.apache.coyote.http11: WARN  # HTTP 파싱 오류 로그 레벨 조정

# SSL 비활성화 명시
server:
  ssl:
    enabled: false

app:
  metric:
    # 개발 환경에서는 metric_data 저장 방지 (통합 테스트 전용)
    persist: false
