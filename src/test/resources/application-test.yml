spring:
  application:
    name: DBMonitor-Test

  # 테스트용 DataSource (H2 인메모리 DB)
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    type: com.zaxxer.hikari.HikariDataSource

  # Redis 설정 (테스트에서는 연결 실패해도 무시)
  data:
    redis:
      host: localhost
      port: 6379

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  # Security 비활성화 (테스트용)
  security:
    require-ssl: false

  # Redis 자동 구성 제외 (선택)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# MyBatis 설정
mybatis:
  mapper-locations: classpath:/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.sys.dbmonitor.domains.*.domain

# 서버 설정
server:
  port: 0  # 랜덤 포트 사용
  servlet:
    context-path: /api
  ssl:
    enabled: false

# 로깅
logging:
  level:
    root: WARN
    com.sys.dbmonitor: INFO

