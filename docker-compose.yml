version: '3.8'

services:
  application:
    image: 2nit_spring:latest
    container_name: 2nit_spring
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:oracle:thin:@localhost:1521:XE}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-system}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"