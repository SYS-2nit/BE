plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}
ext {
    springAiVersion = "1.1.0"
}

group = 'com.sys'
version = '0.0.1-SNAPSHOT'
description = 'DBMonitor'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-mail' // 이메일 전송

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Batch
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    testImplementation 'org.springframework.batch:spring-batch-test'

    // security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    testImplementation 'org.springframework.security:spring-security-test'

    // Oracle JDBC Driver
    implementation 'com.oracle.database.jdbc:ojdbc11:21.9.0.0'
    
    // PostgreSQL JDBC Driver
    implementation 'org.postgresql:postgresql:42.7.1'
    
    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // Lettuce 클라이언트 (Spring Boot 3 기본)
    implementation 'io.lettuce:lettuce-core'


    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // H2 Database (테스트용)
    testRuntimeOnly 'com.h2database:h2'
    runtimeOnly 'com.h2database:h2'

    // === API Documentation ===
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
    
    // === QueryDSL ===
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    
    // === Apache POI (Word 문서 생성) ===
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    
    // === Apache PDFBox (PDF 문서 생성) ===
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'
    
    // === JFreeChart (차트 이미지 생성) ===
    implementation 'org.jfree:jfreechart:1.5.3'
}

// QueryDSL Q클래스 생성 위치 설정
def querydslDir = "$buildDir/generated/querydsl"

tasks.withType(JavaCompile).configureEach {
    options.annotationProcessorGeneratedSourcesDirectory = file(querydslDir)
}

sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

clean {
    delete file(querydslDir)
}
dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:$springAiVersion"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
