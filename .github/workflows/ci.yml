#  ******************************************************************
#  */
name: CI - Build

# ✅ PR에서만 실행
on:
  pull_request:
    branches: [ "dev", "main" ]

permissions:
  contents: read
  pull-requests: write  # PR 코멘트 작성 권한

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 1단계: 환경 설정
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 2단계: 환경 변수 설정 (기존과 동일)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Set environment values
        run: |
          cd ./src/main/resources
          touch ./env.properties
          echo "${{ secrets.ENV }}" > ./env.properties
        shell: bash

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 3단계: 빌드 (테스트 제외)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: clean build -x test  # ⏭️ 테스트 제외 (CI에서만)

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 4단계: 빌드 결과 검증
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Verify build artifacts
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 빌드 결과 확인"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          ls -lh build/libs/
          
          # JAR 파일 찾기 (-plain.jar 제외)
          JAR_FILE=$(find build/libs -name "*.jar" -not -name "*-plain.jar" | head -1)
          
          if [ -z "$JAR_FILE" ]; then
            echo "❌ 에러: JAR 파일이 생성되지 않았습니다"
            exit 1
          fi
          
          echo "✅ 빌드 성공: $(basename $JAR_FILE)"
          
          # 파일 크기
          FILE_SIZE=$(du -h "$JAR_FILE" | cut -f1)
          echo "📊 파일 크기: ${FILE_SIZE}"
          echo ""

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 5단계: Docker 이미지 빌드 테스트 (push 안 함!)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Docker build test
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🐳 Docker 이미지 빌드 테스트"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # PR 번호를 태그로 사용
          docker build -t test-image:pr-${{ github.event.pull_request.number }} .
          
          echo "✅ Docker 빌드 성공"
          echo ""
          echo "이미지 정보:"
          docker images | head -n 2
          echo ""
          echo "⚠️  주의: 이미지를 Docker Hub에 푸시하지 않습니다"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 6단계: PR에 결과 코멘트 작성
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Comment PR with results
        if: always()  # 성공/실패 관계없이 항상 실행
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const jobStatus = '${{ job.status }}';
            const emoji = jobStatus === 'success' ? '✅' : '❌';
            const statusText = jobStatus === 'success' ? '성공' : '실패';
            const color = jobStatus === 'success' ? '🟢' : '🔴';
            
            let body = `## ${emoji} CI 빌드 ${statusText}\n\n`;
            
            // 기본 정보
            body += `### 📋 빌드 정보\n`;
            body += `- **커밋**: \`${context.sha.substring(0, 7)}\`\n`;
            body += `- **작성자**: @${context.actor}\n`;
            body += `- **소스 브랜치**: \`${context.payload.pull_request.head.ref}\`\n`;
            body += `- **타겟 브랜치**: \`${context.payload.pull_request.base.ref}\`\n\n`;
            
            if (jobStatus === 'success') {
              body += `### ✅ 검증 완료\n\n`;
              body += `| 항목 | 상태 |\n`;
              body += `|------|------|\n`;
              body += `| Gradle 빌드 | ✅ 성공 |\n`;
              body += `| 단위 테스트 | ⏭️ 건너뜀 |\n`;
              body += `| Docker 이미지 빌드 | ✅ 성공 |\n\n`;
              body += `---\n\n`;
              body += `> 💡 **다음 단계**: 코드 리뷰 후 \`dev\` 브랜치에 merge하면 자동으로 배포됩니다.\n`;
            } else {
              body += `### ❌ 빌드 실패\n\n`;
              body += `빌드 또는 테스트에 실패했습니다. 아래 로그를 확인해주세요.\n\n`;
            }
            
            body += `\n📊 [워크플로우 상세 로그 보기](${context.payload.repository.html_url}/actions/runs/${context.runId})`;
            
            // PR에 코멘트 작성
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });