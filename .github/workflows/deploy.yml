name: CD - Deploy to Production

on:
  push:
    branches: [ "dev" ]
  pull_request:
    types: [closed]
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    # ✅ Push 또는 Merge된 PR에만 실행
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # ✅ PR merge인 경우 해당 커밋으로 체크아웃
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set environment values
        run: |
          cd ./src/main/resources
          touch ./env.properties
          echo "${{ secrets.ENV }}" > ./env.properties
        shell: bash

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: clean build -x test

      - name: Verify build artifacts
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 빌드 결과 확인"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          ls -lh build/libs/
          
          JAR_FILE=$(find build/libs -name "*.jar" -not -name "*-plain.jar" | head -1)
          
          if [ -z "$JAR_FILE" ]; then
            echo "❌ 에러: JAR 파일이 생성되지 않았습니다"
            exit 1
          fi
          
          echo "✅ 빌드 성공: $(basename $JAR_FILE)"
          FILE_SIZE=$(du -h "$JAR_FILE" | cut -f1)
          echo "📊 파일 크기: ${FILE_SIZE}"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 3단계: Docker 이미지 빌드 & 푸시
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Docker build and push
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🐳 Docker 이미지 빌드 및 푸시"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "이미지: ${DOCKER_USER}/${IMAGE_NAME}:${SHORT_SHA}"
          echo ""
          
          # ✅ 보안: --password-stdin 사용
          echo "${DOCKER_PASSWORD}" | docker login -u ${DOCKER_USER} --password-stdin
          
          # 이미지 빌드
          docker build -t ${DOCKER_USER}/${IMAGE_NAME}:${SHORT_SHA} .
          
          # latest 태그도 추가
          docker tag ${DOCKER_USER}/${IMAGE_NAME}:${SHORT_SHA} ${DOCKER_USER}/${IMAGE_NAME}:latest
          
          # Docker Hub에 푸시
          echo "푸시 중: ${SHORT_SHA} 태그..."
          docker push ${DOCKER_USER}/${IMAGE_NAME}:${SHORT_SHA}
          
          echo "푸시 중: latest 태그..."
          docker push ${DOCKER_USER}/${IMAGE_NAME}:latest
          
          echo ""
          echo "✅ 이미지 푸시 완료"
          echo "  - ${DOCKER_USER}/${IMAGE_NAME}:${SHORT_SHA}"
          echo "  - ${DOCKER_USER}/${IMAGE_NAME}:latest"
          
          # 환경 변수로 저장 (다음 단계에서 사용)
          echo "DOCKER_USER=${DOCKER_USER}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 4단계: Docker Hub 오래된 이미지 정리
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Cleanup old Docker Hub images
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}

          KEEP_LAST: 3
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧹 Docker Hub 이미지 정리"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "유지할 이미지: 최근 ${KEEP_LAST}개"
          echo ""
          
          # Docker Hub API 토큰 발급
          TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKER_USER}\",\"password\":\"${DOCKER_PASSWORD}\"}" \
            "https://hub.docker.com/v2/users/login/" | jq -r .token)
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "⚠️ Docker Hub 로그인 실패, 정리 건너뜀"
            exit 0

          fi
          
          echo "✅ Docker Hub 로그인 성공"
          
          # SHA 형식 태그만 가져오기 (abc1234 형식)
          TAGS=$(curl -s -H "Authorization: JWT ${TOKEN}" \
            "https://hub.docker.com/v2/repositories/${DOCKER_USER}/${IMAGE_NAME}/tags/?page_size=100" \
            | jq -r '.results[] | select(.name | test("^[a-f0-9]{7}$")) | .name' \
            | sort -r)
          
          if [ -z "$TAGS" ]; then
            echo "⚠️ SHA 태그를 찾을 수 없습니다"
            exit 0
          fi
          
          TAG_COUNT=$(echo "$TAGS" | wc -l | tr -d ' ')
          echo "전체 SHA 태그: ${TAG_COUNT}개"
          
          if [ $TAG_COUNT -le $KEEP_LAST ]; then
            echo "✅ 삭제할 이미지 없음 (${TAG_COUNT}개 ≤ ${KEEP_LAST}개)"
            exit 0
          fi
          
          # 오래된 태그 삭제
          DELETE_COUNT=$((TAG_COUNT - KEEP_LAST))
          echo "삭제할 태그: ${DELETE_COUNT}개"
          echo ""
          
          TAGS_TO_DELETE=$(echo "$TAGS" | tail -n ${DELETE_COUNT})
          
          DELETED=0
          FAILED=0
          
          # ✅ 개별 삭제 실패가 전체 스크립트를 중단하지 않도록 함
          set +e
          
          for TAG in $TAGS_TO_DELETE; do
            echo -n "  삭제 중: ${TAG}... "
          
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: JWT ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/${DOCKER_USER}/${IMAGE_NAME}/tags/${TAG}/")
          
            if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "✅"
              DELETED=$((DELETED + 1))
            else
              echo "❌ (HTTP ${HTTP_CODE})"
              FAILED=$((FAILED + 1))
            fi
          
            sleep 0.5
          done
          
          # ✅ set -e 다시 활성화
          set -e
          
          echo ""
          echo "✅ 정리 완료"
          echo "  - 성공: ${DELETED}개"
          echo "  - 실패: ${FAILED}개"
          echo "  - 유지: ${KEEP_LAST}개 (최신)"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 5단계: docker-compose.yml 서버로 복사
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.SSH_USERNAME }}/deploy"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 6단계: 서버에 배포
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            # ✅ 환경 변수 사용 (하드코딩 제거)
            DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
            IMAGE_NAME="${{ secrets.DOCKER_IMAGE_NAME }}"
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            FULL_IMAGE="${DOCKER_USER}/${IMAGE_NAME}:${SHORT_SHA}"
            DEPLOY_DIR="/home/${{ secrets.SSH_USERNAME }}/deploy"
            
            echo "========================================"
            echo "🚀 배포 시작"
            echo "========================================"
            echo "이미지: ${FULL_IMAGE}"
            echo "배포 디렉토리: ${DEPLOY_DIR}"
            echo "시간: $(date '+%Y-%m-%d %H:%M:%S')"
            echo ""
            
            cd ${DEPLOY_DIR}
            
            # ✅ 보안: --password-stdin 사용
            echo "--- Docker 로그인 ---"
            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | sudo docker login -u ${DOCKER_USER} --password-stdin
            
            # 기존 컨테이너 중지 및 제거
            echo ""
            echo "--- 기존 컨테이너 정리 ---"
            sudo docker-compose down || true
            
            # 새 이미지 pull
            echo ""
            echo "--- 새 이미지 다운로드 ---"
            sudo docker pull ${FULL_IMAGE}
            
            # docker-compose에서 사용할 이름으로 태그
            echo ""
            echo "--- 이미지 태그 생성 ---"
            sudo docker tag ${FULL_IMAGE} 2nit_spring
            
            # 새 컨테이너 시작
            echo ""
            echo "--- 컨테이너 시작 ---"
            sudo docker-compose up -d
            
            # 컨테이너 상태 확인
            echo ""
            echo "--- 컨테이너 상태 확인 ---"
            sleep 5  # 컨테이너 시작 대기
            
            if sudo docker ps | grep -q 2nit_spring; then
              echo "✅ 컨테이너 실행 중"
              sudo docker ps | grep 2nit_spring
            else
              echo "❌ 컨테이너가 실행되지 않았습니다"
              sudo docker ps -a | grep 2nit_spring
              exit 1
            fi
            
            # 애플리케이션 로그 확인 (최근 30줄)
            echo ""
            echo "--- 애플리케이션 로그 (최근 30줄) ---"
            sudo docker logs --tail 30 2nit_spring
            
            # 로컬 이미지 정리 (3일 이상 된 이미지)
            echo ""
            echo "--- 로컬 이미지 정리 ---"
            BEFORE=$(sudo docker images | wc -l)
            sudo docker image prune -af --filter "until=72h" || true
            AFTER=$(sudo docker images | wc -l)
            CLEANED=$((BEFORE - AFTER))
            
            if [ $CLEANED -gt 0 ]; then
              echo "🧹 ${CLEANED}개 이미지 정리됨"
            else
              echo "✅ 정리할 이미지 없음"
            fi
            
            echo ""
            echo "========================================"
            echo "✅ 배포 완료"
            echo "========================================"
            echo "배포 시간: $(date '+%Y-%m-%d %H:%M:%S')"