name: CD - Deploy to Production

on:
  pull_request:
    types: [opened, synchronize]
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # ✅ PR 생성/업데이트 시점에만 배포
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set environment values
        run: |
          cd ./src/main/resources
          touch ./env.properties
          echo "${{ secrets.ENV }}" > ./env.properties
          echo "DB_URL=${{ secrets.DB_URL }}" >> ./env.properties
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> ./env.properties
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> ./env.properties
          echo "SSL_PASSWORD=${{ secrets.SSL_PASSWORD }}" >> ./env.properties
          echo "REDIS_HOST=redis" >> ./env.properties
          echo "REDIS_PORT=6379" >> ./env.properties
        shell: bash


      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: clean build -x test

      - name: Verify build artifacts
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 빌드 결과 확인"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          ls -lh build/libs/
          
          JAR_FILE=$(find build/libs -name "*.jar" -not -name "*-plain.jar" | head -1)
          
          if [ -z "$JAR_FILE" ]; then
            echo "❌ 에러: JAR 파일이 생성되지 않았습니다"
            exit 1
          fi
          
          echo "✅ 빌드 성공: $(basename $JAR_FILE)"
          FILE_SIZE=$(du -h "$JAR_FILE" | cut -f1)
          echo "📊 파일 크기: ${FILE_SIZE}"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 3단계: Docker 이미지 빌드 & 푸시
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Docker build and push
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
        run: |
          # PR 이벤트인 경우 PR의 head SHA 사용, 그 외에는 현재 SHA 사용
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          else
            COMMIT_SHA="${GITHUB_SHA}"
          fi
          SHORT_SHA=${COMMIT_SHA::7}
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🐳 Docker 이미지 빌드 및 푸시"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "이벤트: ${{ github.event_name }}"
          echo "커밋 SHA: ${COMMIT_SHA}"
          echo "이미지: ${DOCKER_USER}/${IMAGE_NAME}:${SHORT_SHA}"
          echo ""
          
          # ✅ 보안: --password-stdin 사용
          echo "${DOCKER_PASSWORD}" | docker login -u ${DOCKER_USER} --password-stdin
          
          # ✅ 로그인 확인
          if [ $? -eq 0 ]; then
            echo "✅ Docker Hub 로그인 성공"
          else
            echo "❌ Docker Hub 로그인 실패"
            exit 1
          fi
          
          # 이미지 빌드
          echo "🔨 이미지 빌드 중..."
          docker build -t ${DOCKER_USER}/${IMAGE_NAME}:${SHORT_SHA} .
          
          # ✅ 빌드 확인
          if [ $? -eq 0 ]; then
            echo "✅ 이미지 빌드 성공"
          else
            echo "❌ 이미지 빌드 실패"
            exit 1
          fi
          
          # latest 태그도 추가
          docker tag ${DOCKER_USER}/${IMAGE_NAME}:${SHORT_SHA} ${DOCKER_USER}/${IMAGE_NAME}:latest
          
          # Docker Hub에 푸시 (SHA 태그)
          echo "📤 SHA 태그 푸시 중: ${SHORT_SHA}..."
          docker push ${DOCKER_USER}/${IMAGE_NAME}:${SHORT_SHA}
          
          # ✅ SHA 태그 푸시 확인
          if [ $? -eq 0 ]; then
            echo "✅ SHA 태그 푸시 성공: ${SHORT_SHA}"
          else
            echo "❌ SHA 태그 푸시 실패: ${SHORT_SHA}"
            exit 1
          fi
          
          # Docker Hub에 푸시 (latest 태그)
          echo "📤 latest 태그 푸시 중..."
          docker push ${DOCKER_USER}/${IMAGE_NAME}:latest
          
          # ✅ latest 태그 푸시 확인
          if [ $? -eq 0 ]; then
            echo "✅ latest 태그 푸시 성공"
          else
            echo "❌ latest 태그 푸시 실패"
            exit 1
          fi
          
          echo ""
          echo "✅ 모든 이미지 푸시 완료"
          echo "  - ${DOCKER_USER}/${IMAGE_NAME}:${SHORT_SHA}"
          echo "  - ${DOCKER_USER}/${IMAGE_NAME}:latest"
          
          # ✅ Docker Hub에서 이미지 확인
          echo ""
          echo "--- Docker Hub 이미지 확인 ---"
          TAG_RESPONSE=$(curl -s "https://hub.docker.com/v2/repositories/${DOCKER_USER}/${IMAGE_NAME}/tags/")
          
          # 디버깅: 응답 확인
          if [ -z "$TAG_RESPONSE" ] || [ "$TAG_RESPONSE" = "null" ]; then
            echo "⚠️  Docker Hub API 응답이 null입니다. 가능한 원인:"
            echo "   - 리포지토리가 비공개이거나 존재하지 않음"
            echo "   - API Rate Limit 초과"
            echo "   - 네트워크 문제"
            echo "   (이 경고는 무시해도 배포에는 영향 없습니다)"
          else
            TAG_LIST=$(echo "$TAG_RESPONSE" | jq -r '.results[]?.name // empty' 2>/dev/null | head -5)
            if [ -n "$TAG_LIST" ]; then
              echo "최근 태그:"
              echo "$TAG_LIST"
            else
              echo "⚠️  태그 목록이 비어있습니다"
            fi
          fi
          
          # 환경 변수로 저장 (다음 단계에서 사용)
          echo "DOCKER_USER=${DOCKER_USER}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 4단계: Docker Hub 오래된 이미지 정리
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Cleanup old Docker Hub images
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
          KEEP_LAST: 3
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧹 Docker Hub 이미지 정리"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "유지할 이미지: 최근 ${KEEP_LAST}개"
          echo ""
          
          # Docker Hub API 토큰 발급
          TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKER_USER}\",\"password\":\"${DOCKER_PASSWORD}\"}" \
            "https://hub.docker.com/v2/users/login/" | jq -r .token)
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "⚠️ Docker Hub 로그인 실패, 정리 건너뜀"
            exit 0

          fi
          
          echo "✅ Docker Hub 로그인 성공"
          
          # SHA 형식 태그만 가져오기 (abc1234 형식)
          TAGS=$(curl -s -H "Authorization: JWT ${TOKEN}" \
            "https://hub.docker.com/v2/repositories/${DOCKER_USER}/${IMAGE_NAME}/tags/?page_size=100" \
            | jq -r '.results[] | select(.name | test("^[a-f0-9]{7}$")) | .name' \
            | sort -r)
          
          if [ -z "$TAGS" ]; then
            echo "⚠️ SHA 태그를 찾을 수 없습니다"
            exit 0
          fi
          
          TAG_COUNT=$(echo "$TAGS" | wc -l | tr -d ' ')
          echo "전체 SHA 태그: ${TAG_COUNT}개"
          
          if [ $TAG_COUNT -le $KEEP_LAST ]; then
            echo "✅ 삭제할 이미지 없음 (${TAG_COUNT}개 ≤ ${KEEP_LAST}개)"
            exit 0
          fi
          
          # 오래된 태그 삭제
          DELETE_COUNT=$((TAG_COUNT - KEEP_LAST))
          echo "삭제할 태그: ${DELETE_COUNT}개"
          echo ""
          
          TAGS_TO_DELETE=$(echo "$TAGS" | tail -n ${DELETE_COUNT})
          
          DELETED=0
          FAILED=0
          
          # ✅ 개별 삭제 실패가 전체 스크립트를 중단하지 않도록 함
          set +e
          
          for TAG in $TAGS_TO_DELETE; do
            echo -n "  삭제 중: ${TAG}... "
          
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: JWT ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/${DOCKER_USER}/${IMAGE_NAME}/tags/${TAG}/")
          
            if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "✅"
              DELETED=$((DELETED + 1))
            else
              echo "❌ (HTTP ${HTTP_CODE})"
              FAILED=$((FAILED + 1))
            fi
          
            sleep 0.5
          done
          
          # ✅ set -e 다시 활성화
          set -e
          
          echo ""
          echo "✅ 정리 완료"
          echo "  - 성공: ${DELETED}개"
          echo "  - 실패: ${FAILED}개"
          echo "  - 유지: ${KEEP_LAST}개 (최신)"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 5단계: 서버에 배포
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 10m  # SSH 명령 타임아웃 설정 (10분)
          script: |
            # ✅ 환경 변수 설정
            DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
            IMAGE_NAME="${{ secrets.DOCKER_IMAGE_NAME }}"
            # PR 이벤트인 경우 PR의 head SHA 사용, 그 외에는 현재 SHA 사용
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
            else
              COMMIT_SHA="${{ github.sha }}"
            fi
            SHORT_SHA=$(echo "${COMMIT_SHA}" | cut -c1-7)
            FULL_IMAGE="${DOCKER_USER}/${IMAGE_NAME}:${SHORT_SHA}"
            LATEST_IMAGE="${DOCKER_USER}/${IMAGE_NAME}:latest"
            DEPLOY_DIR="/home/${{ secrets.SSH_USERNAME }}/deploy"
            
            echo "========================================"
            echo "🚀 배포 시작"
            echo "========================================"
            echo "SHA 이미지: ${FULL_IMAGE}"
            echo "Latest 이미지: ${LATEST_IMAGE}"
            echo "배포 디렉토리: ${DEPLOY_DIR}"
            echo "시간: $(date '+%Y-%m-%d %H:%M:%S')"
            echo ""
            
            # ✅ 배포 디렉토리 생성
            echo "--- 배포 디렉토리 생성 ---"
            sudo mkdir -p ${DEPLOY_DIR}
            sudo chown ${{ secrets.SSH_USERNAME }}:${{ secrets.SSH_USERNAME }} ${DEPLOY_DIR}
            
            cd ${DEPLOY_DIR}
            
            # ✅ Docker Hub 로그인 검증
            echo "--- Docker Hub 로그인 ---"
            LOGIN_RESULT=$(echo "${{ secrets.DOCKERHUB_PASSWORD }}" | sudo docker login -u ${DOCKER_USER} --password-stdin 2>&1)
            echo "로그인 결과: ${LOGIN_RESULT}"
            
            if echo "${LOGIN_RESULT}" | grep -q "Login Succeeded"; then
              echo "✅ Docker Hub 로그인 성공"
            else
              echo "❌ Docker Hub 로그인 실패"
              echo "에러: ${LOGIN_RESULT}"
              exit 1
            fi
            
            # ✅ 이미지 pull 시도 (SHA 태그 먼저)
            echo ""
            echo "--- SHA 태그 이미지 다운로드 시도 ---"
            PULL_RESULT=$(sudo docker pull ${FULL_IMAGE} 2>&1)
            echo "SHA Pull 결과: ${PULL_RESULT}"
            
            if echo "${PULL_RESULT}" | grep -q "Downloaded newer image\|Image is up to date\|Pulling from"; then
              echo "✅ SHA 태그 이미지 다운로드 성공"
              SELECTED_IMAGE=${FULL_IMAGE}
            else
              echo "⚠️ SHA 태그 이미지 다운로드 실패, latest 태그로 대체"
            
              # ✅ latest 태그로 대체 시도
              echo ""
              echo "--- latest 태그 이미지 다운로드 시도 ---"
              LATEST_PULL_RESULT=$(sudo docker pull ${LATEST_IMAGE} 2>&1)
              echo "Latest Pull 결과: ${LATEST_PULL_RESULT}"
            
              if echo "${LATEST_PULL_RESULT}" | grep -q "Downloaded newer image\|Image is up to date\|Pulling from"; then
                echo "✅ latest 태그 이미지 다운로드 성공"
                SELECTED_IMAGE=${LATEST_IMAGE}
              else
                echo "❌ latest 태그 이미지도 다운로드 실패"
                echo "에러: ${LATEST_PULL_RESULT}"
                exit 1
              fi
            fi
            
            # 기존 컨테이너 중지 및 제거 (강제, 타임아웃 최소화)
            echo ""
            echo "--- 기존 컨테이너 정리 ---"
            CONTAINER_ID=$(sudo docker ps -aq --filter "name=2nit_spring" | head -1)
            
            if [ -n "$CONTAINER_ID" ]; then
              echo "기존 컨테이너 발견 (ID: $CONTAINER_ID), 강제 제거 중..."
              
              # 1. 컨테이너 중지 시도 (5초 타임아웃), 실패해도 계속 진행
              sudo docker stop --time=5 "$CONTAINER_ID" 2>/dev/null || true
              
              # 2. 컨테이너 강제 종료 (kill)
              sudo docker kill "$CONTAINER_ID" 2>/dev/null || true
              
              # 3. 컨테이너 제거 (강제, -f 옵션으로 중지된 컨테이너도 제거)
              sudo docker rm -f "$CONTAINER_ID" 2>/dev/null || true
              
              # 4. 이름으로도 시도
              sudo docker rm -f 2nit_spring 2>/dev/null || true
              
              echo "✅ 기존 컨테이너 제거 완료"
            else
              echo "기존 컨테이너 없음"
            fi
            
            # 최종 확인 및 재시도 (한 번만)
            REMAINING=$(sudo docker ps -aq --filter "name=2nit_spring")
            if [ -n "$REMAINING" ]; then
              echo "⚠️  컨테이너가 아직 존재합니다 (ID: $REMAINING). 최종 강제 제거..."
              echo "$REMAINING" | xargs -r sudo docker kill 2>/dev/null || true
              echo "$REMAINING" | xargs -r sudo docker rm -f 2>/dev/null || true
            fi
            
            # 제거 확인
            FINAL_CHECK=$(sudo docker ps -aq --filter "name=2nit_spring")
            if [ -n "$FINAL_CHECK" ]; then
              echo "⚠️  컨테이너가 여전히 존재합니다 (ID: $FINAL_CHECK). 새 컨테이너 시작 시도..."
              echo "이전 컨테이너는 수동 제거가 필요할 수 있습니다."
            else
              echo "✅ 컨테이너 완전히 제거됨"
            fi
            
            # Redis 컨테이너 네트워크 확인 및 생성
            echo ""
            echo "--- Redis 컨테이너 및 네트워크 확인 ---"
            
            # docker-compose.yml이 있는지 확인하고 없으면 생성
            if [ ! -f "${DEPLOY_DIR}/docker-compose.yml" ]; then
              echo "⚠️  docker-compose.yml이 없습니다. 생성합니다..."
              sudo bash -c 'printf "%s\n" "version: \"3.8\"" "services:" "  redis:" "    image: redis:7-alpine" "    container_name: 2nit_redis" "    ports:" "      - \"6379:6379\"" "    restart: unless-stopped" "    command: redis-server --appendonly yes" "    volumes:" "      - redis_data:/data" "    networks:" "      - dbmonitor-network" "    healthcheck:" "      test: [\"CMD\", \"redis-cli\", \"ping\"]" "      interval: 10s" "      timeout: 3s" "      retries: 3" "networks:" "  dbmonitor-network:" "    driver: bridge" "volumes:" "  redis_data:" > '"${DEPLOY_DIR}"'/docker-compose.yml'
              echo "✅ docker-compose.yml 생성 완료"
            fi
            
            cd ${DEPLOY_DIR}
            
            # Redis 컨테이너가 실행 중인지 확인
            REDIS_CONTAINER=$(sudo docker ps --filter "name=2nit_redis" --format "{{.Names}}" | head -1)
            
            if [ -z "$REDIS_CONTAINER" ]; then
              echo "⚠️  Redis 컨테이너가 실행 중이 아닙니다. 시작합니다..."
              sudo docker-compose up -d redis
              echo "⏳ Redis 컨테이너 시작 대기 중..."
              sleep 10  # Redis 시작 대기
              
              # Redis 컨테이너 상태 확인
              if sudo docker ps --filter "name=2nit_redis" --format "{{.Names}}" | grep -q "2nit_redis"; then
                echo "✅ Redis 컨테이너 시작 완료"
              else
                echo "❌ Redis 컨테이너 시작 실패"
                sudo docker logs 2nit_redis 2>/dev/null || echo "Redis 컨테이너 로그를 가져올 수 없습니다"
                echo "❌ Redis는 필수 서비스이므로 배포를 중단합니다."
                exit 1
              fi
            else
              echo "✅ Redis 컨테이너 실행 중: ${REDIS_CONTAINER}"
            fi
            
            # Redis 연결 테스트 (필수)
            echo "--- Redis 연결 테스트 (필수) ---"
            if sudo docker exec 2nit_redis redis-cli ping 2>/dev/null | grep -q "PONG"; then
              echo "✅ Redis 연결 성공"
            else
              echo "❌ Redis 연결 테스트 실패"
              echo "❌ Redis는 필수 서비스이므로 배포를 중단합니다."
              exit 1
            fi
            
            # Redis 컨테이너의 네트워크 확인
            REDIS_NETWORK=$(sudo docker inspect ${REDIS_CONTAINER:-2nit_redis} --format='{{range $net, $conf := .NetworkSettings.Networks}}{{$net}}{{end}}' 2>/dev/null | head -1)
            
            if [ -z "$REDIS_NETWORK" ]; then
              # 네트워크가 없으면 dbmonitor-network를 찾거나 생성
              echo "⚠️  Redis 네트워크를 찾을 수 없습니다. dbmonitor-network를 확인합니다..."
              
              # dbmonitor-network가 존재하는지 확인
              if sudo docker network ls | grep -q "dbmonitor-network"; then
                echo "✅ dbmonitor-network 발견"
                USE_NETWORK="dbmonitor-network"
              else
                # 네트워크 생성
                echo "📦 dbmonitor-network 생성 중..."
                sudo docker network create dbmonitor-network 2>/dev/null || true
                USE_NETWORK="dbmonitor-network"
                
                # Redis 컨테이너가 실행 중이면 네트워크에 연결
                if [ -n "$REDIS_CONTAINER" ] && sudo docker ps --filter "name=${REDIS_CONTAINER}" --format "{{.Names}}" | grep -q "${REDIS_CONTAINER}"; then
                  echo "🔗 Redis 컨테이너를 dbmonitor-network에 연결 중..."
                  sudo docker network connect dbmonitor-network ${REDIS_CONTAINER} 2>/dev/null || true
                fi
              fi
            else
              echo "✅ Redis 네트워크 발견: ${REDIS_NETWORK}"
              USE_NETWORK="${REDIS_NETWORK}"
            fi
            
            # 새 컨테이너 시작
            echo ""
            echo "--- 컨테이너 시작 (네트워크: ${USE_NETWORK}) ---"
            
            # Docker 명령어로 직접 실행 (Redis와 같은 네트워크 사용)
            sudo docker run -d \
              --name 2nit_spring \
              -p 8080:8080 \
              -e SPRING_DATASOURCE_URL="${{ secrets.DB_URL }}" \
              -e SPRING_DATASOURCE_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e SPRING_PROFILES_ACTIVE="${{ secrets.SPRING_PROFILES_ACTIVE }}" \
              -e SSL_PASSWORD="${{ secrets.SSL_PASSWORD }}" \
              -e REDIS_HOST="redis" \
              -e REDIS_PORT="6379" \
              -v /home/qowhx12/ssl:/app/ssl:ro \
              --restart unless-stopped \
              --network ${USE_NETWORK} \
              ${SELECTED_IMAGE}
            
            # 컨테이너 상태 확인
            echo ""
            echo "--- 컨테이너 상태 확인 ---"
            sleep 10  # 컨테이너 시작 대기
            
            if sudo docker ps | grep -q 2nit_spring; then
              echo "✅ 컨테이너 실행 중"
              sudo docker ps | grep 2nit_spring
            
              # 포트 상태 확인
              echo ""
              echo "--- 포트 상태 확인 ---"
              sudo ss -tlnp | grep 808 || echo "⚠️ 8080 포트가 열려있지 않습니다"
            
            else
              echo "❌ 컨테이너가 실행되지 않았습니다"
              sudo docker ps -a | grep 2nit_spring
              echo "--- 컨테이너 로그 ---"
              sudo docker logs 2nit_spring
              exit 1
            fi
            
            # 애플리케이션 로그 확인 (최근 30줄)
            echo ""
            echo "--- 애플리케이션 로그 (최근 30줄) ---"
            sudo docker logs --tail 30 2nit_spring
            
            echo ""
            echo "========================================"
            echo "✅ 배포 완료"
            echo "========================================"
            echo "배포 시간: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "사용된 이미지: ${SELECTED_IMAGE}"