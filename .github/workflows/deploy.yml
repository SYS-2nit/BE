name: Deploy

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # 기본 체크아웃
    - name: Checkout
      uses: actions/checkout@v3
    # Gradlew 실행 허용
    - name: Run chmod to make gradlew executable
      run: chmod +x ./gradlew
    # JDK 17 세팅
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    # 환경 변수 설정
    - name: Set environment values
      run: |
        cd ./src/main/resources
        touch ./env.properties
        echo "${{ secrets.ENV }}" > ./env.properties
      shell: bash
    # Gradle build (Test 제외)
    - name: Build with Gradle
      uses: gradle/gradle-build-action@67421db6bd0bf253fb4bd25b31ebb98943c375e1
      with:
        arguments: clean build -x test
    # Docker build
    - name: Docker build
      run: |
        docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
        docker build -t sys-2nit .
        docker tag sys-2nit qowl880/sys-2nit:${GITHUB_SHA::7}
        docker push qowl880/sys-2nit:${GITHUB_SHA::7}

    # Deploy
    - name: Deploy
      uses: appleboy/ssh-action@master
      with:
        host: 35.216.118.15
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          # 변수 설정
          DOCKER_USER="qowl880"
          IMAGE_NAME="sys-2nit"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          FULL_IMAGE="${DOCKER_USER}/${IMAGE_NAME}:${SHORT_SHA}"
          
          echo "=== 배포 시작: ${FULL_IMAGE} ==="
          
          # Docker 로그인 (보안 경고 제거)
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | sudo docker login -u ${DOCKER_USER} --password-stdin
          
          # 1. 기존 컨테이너 중지 및 제거
          echo "=== 기존 컨테이너 정리 ==="
          sudo docker-compose down || true
          
          # 2. 새 이미지 pull
          echo "=== 새 이미지 다운로드 ==="
          sudo docker pull ${FULL_IMAGE}
          
          # 3. 로컬 태그 생성 (기존 태그가 있으면 덮어쓰기)
          echo "=== 이미지 태그 생성 ==="
          sudo docker tag ${FULL_IMAGE} 2nit_spring
          
          # 4. 새 컨테이너 시작
          echo "=== 컨테이너 시작 ==="
          sudo docker-compose up -d
          
          # 5. 오래된 이미지 정리 (선택사항)
          echo "=== 이미지 정리 ==="
          sudo docker image prune -af --filter "until=48h" || true
          
          echo "=== 배포 완료 ==="