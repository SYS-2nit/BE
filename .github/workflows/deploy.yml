name: Deploy

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # 기본 체크아웃
    - name: Checkout
      uses: actions/checkout@v3
    # Gradlew 실행 허용
    - name: Run chmod to make gradlew executable
      run: chmod +x ./gradlew
    # JDK 17 세팅
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    # 환경 변수 설정
    - name: Set environment values
      run: |
        cd ./src/main/resources
        touch ./env.properties
        echo "${{ secrets.ENV }}" > ./env.properties
      shell: bash
    # Gradle build (Test 제외)
    - name: Build with Gradle
      uses: gradle/gradle-build-action@67421db6bd0bf253fb4bd25b31ebb98943c375e1
      with:
        arguments: clean build -x test
    # Docker build
    - name: Docker build
      run: |
        docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
        docker build -t sys-2nit .
        docker tag sys-2nit qowl880/sys-2nit:${GITHUB_SHA::7}
        docker push qowl880/sys-2nit:${GITHUB_SHA::7}

    # Deploy (수정된 버전)
    - name: Copy docker-compose.yml to server
      uses: appleboy/scp-action@master
      with:
        host: 35.216.118.15
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: "docker-compose.yml"
        target: "/home/${{ secrets.SSH_USERNAME }}/deploy"

    - name: Deploy
      uses: appleboy/ssh-action@master
      with:
        host: 35.216.118.15
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        # ✅ 환경 변수 전달
        envs: DB_URL,DB_USERNAME,DB_PASSWORD
        script: |
          # ✅ GitHub Secrets를 환경 변수로 전달
          export DB_URL="${{ secrets.DB_URL }}"
          export DB_USERNAME="${{ secrets.DB_USERNAME }}"
          export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          
          DOCKER_USER="qowl880"
          IMAGE_NAME="sys-2nit"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          FULL_IMAGE="${DOCKER_USER}/${IMAGE_NAME}:${SHORT_SHA}"
          
          cd /home/${{ secrets.SSH_USERNAME }}/deploy
          
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | sudo docker login -u ${DOCKER_USER} --password-stdin
          
          sudo docker-compose down || true
          sudo docker pull ${FULL_IMAGE}
          sudo docker tag ${FULL_IMAGE} 2nit_spring
          
          # ✅ 환경 변수와 함께 실행
          sudo DB_URL="${DB_URL}" \
               DB_USERNAME="${DB_USERNAME}" \
               DB_PASSWORD="${DB_PASSWORD}" \
               docker-compose up -d
          
          echo "=== 배포 완료 ==="